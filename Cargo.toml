[package]
name = "pushizo"
version = "0.2.0"
edition = "2021"
rust-version = "1.71"
description = "Official Rust server SDK for the Pushizo API: push, email, SMS and in-app messaging, users, segments, campaigns and webhook signature verification"
license = "MIT"
authors = ["Pushizo <support@pushizo.com>"]
repository = "https://github.com/pushizo/pushizo-rust"
homepage = "https://docs.pushizo.com/docs/sdk/rust"
documentation = "https://docs.rs/pushizo"
readme = "README.md"
keywords = ["pushizo", "push-notifications", "sms", "email", "webhooks"]
categories = ["api-bindings", "web-programming::http-client"]
include = ["src/**/*.rs", "tests/**/*.rs", "examples/**/*.rs", "Cargo.toml", "README.md", "LICENSE"]

[dependencies]
ureq = "2.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
p256 = "0.13"
base64 = "0.22"
getrandom = "0.2"
httpdate = "1"

[package.metadata.docs.rs]
all-features = true
